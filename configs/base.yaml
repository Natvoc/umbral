# Base configuration. Every key that can be overridden from the CLI must exist here.
seed: 0
experiment: noop

run:
  name: base
  output_dir: runs
  resume_from: null   # path to a checkpoint .pt to resume from

torch:
  num_threads: 4          # intra-op threads; keeps the laptop usable
  num_interop_threads: 1  # can only be set once per process

noop:
  steps: 200
  checkpoint_at: 100
  batch_size: 32
  in_dim: 8
  hidden: 16
  lr: 0.01

# ----------------------------------------------------------------------------
# Phase 1: world and body. Units: arena units and simulation steps (no dt).
# ----------------------------------------------------------------------------
world:
  size: 10.0                    # square arena side
  history_id: 0                 # key into world.histories
  max_steps: 0                  # >0 sets `truncated` after that many env steps; 0 = never
  freeze_when_disembodied: true # pause world and physical body while every link segment is disconnected
  food_radius: 0.22
  neutral_radius: 0.3
  neutral_push_fraction: 0.3    # share of an overlap absorbed by the neutral object (light push)
  spawn_tries: 60               # rejection-sampling attempts when placing an object
  # A history is a fixed version of the world: layout_seed fixes obstacles, neutral
  # objects and initial food; the run seed only sets the body's start pose and
  # where food reappears.
  histories:
    0:
      name: abundancia
      layout_seed: 1000
      food_count: 12
      food_respawn_steps: 40
      food_distribution: uniform  # uniform | patches
      food_patches: 0
      patch_radius: 0.0
      obstacle_layout: scattered  # scattered | corridors | clustered
      obstacle_count: 4
      obstacle_radius: [0.3, 0.6]
      neutral_count: 4
    1:
      name: escasez
      layout_seed: 1001
      food_count: 3
      food_respawn_steps: 300
      food_distribution: uniform
      food_patches: 0
      patch_radius: 0.0
      obstacle_layout: scattered
      obstacle_count: 9
      obstacle_radius: [0.3, 0.7]
      neutral_count: 3
    2:
      name: corredores
      layout_seed: 1002
      food_count: 6
      food_respawn_steps: 120
      food_distribution: uniform
      food_patches: 0
      patch_radius: 0.0
      obstacle_layout: corridors
      obstacle_count: 3           # extra scattered obstacles besides the corridor walls
      obstacle_radius: [0.3, 0.5]
      neutral_count: 3
    3:
      name: oasis
      layout_seed: 1003
      food_count: 8
      food_respawn_steps: 80
      food_distribution: patches
      food_patches: 2
      patch_radius: 0.9
      obstacle_layout: clustered
      obstacle_count: 10
      obstacle_radius: [0.25, 0.5]
      neutral_count: 10

body:
  trunk_radius: 0.5
  max_speed: 0.12               # forward/backward distance per step at action 1
  max_turn: 0.2                 # trunk rotation (rad) per step at action 1
  limb_mount_angles: [0.785398, -0.785398]  # left, right limb roots relative to heading (rad)
  segment_lengths: [0.45, 0.35] # proximal, distal
  limb_radius: 0.05             # limb thickness, used for contact gaps only
  joint_limits: [[-1.3, 1.3], [-2.2, 2.2]]  # [proximal, distal] joint angle ranges (rad)
  max_joint_speed: 0.3          # rad per step at action 1
  touch_range: 0.08             # contact intensity falls from 1 (gap<=0) to 0 (gap>=range)
  vision_rays: 7
  vision_fov: 2.094395          # 120 degrees, centred on the heading
  vision_range: 3.0
  energy:
    initial: 1.0
    basal: 0.0002               # metabolic cost per step (0.0004 until 17 Nov 2026; see docs/protocolo.md)
    effort_cost: 0.0016         # extra cost per step at maximal effort (effort = mean squared executed action)
    food_value: 0.25
    low_threshold: 0.2          # below this energy, strength scales down linearly ...
    min_strength: 0.3           # ... to this at energy 0 (never zero: no death)
  # PROVISIONAL values (protocol: fatigue exists; parameters not yet calibrated).
  fatigue:
    decay: 0.98                 # F <- decay * F + gain * effort, clipped to [0, 1]
    gain: 0.02
    max_penalty: 0.3            # strength multiplier is (1 - max_penalty * F)

random_agent:
  steps: 2000
  smoothing: 0.9                # Ornstein-Uhlenbeck-like: a <- s*a + sqrt(1-s^2)*scale*N(0,1)
  scale: 0.8
  gif_steps: 300                # first N steps rendered to run.gif
  gif_stride: 2
  gif_fps: 15

# ----------------------------------------------------------------------------
# Phase 2a: predictive mind.
# ----------------------------------------------------------------------------
mind:
  encoder: 128                  # Linear(obs + previous action -> encoder), ReLU
  hidden: 256                   # GRU hidden size
  head_hidden: 128              # prediction head: Linear(hidden + action -> head_hidden), ReLU, Linear

train:
  n_envs: 16                    # environments simulated in parallel (histories cycle 0,1,2,3,...)
  seq_len: 32                   # truncated BPTT segment length (steps)
  episode_steps: 1024           # each environment restarts with a new seed after this many steps (staggered)
  updates: 2000                 # training updates (one update = seq_len steps of every environment)
  lr: 0.001
  grad_clip: 1.0
  log_every: 25                 # updates between metric lines
  checkpoint_every: 500         # updates between checkpoints (multiple of log_every)
  smoothing: 0.9                # OU policy, as in random_agent
  scale: 0.8
  ckpt_eval_envs_per_history: 2 # light evaluation at every checkpoint, fixed seeds
  ckpt_eval_steps: 1000
  norm_envs: 16                 # warm-up for the frozen normalization of target changes
  norm_steps: 2000

eval:
  checkpoint: null              # path to a train_world_model checkpoint (.pt)
  envs_per_history: 16          # one evaluation seed per environment
  steps: 2000
  chunk: 64
  n_boot: 10000                 # bootstrap resamples (over seeds, stratified by history) for the 95% CIs
  bootstrap_seed: 0
  physics: trained              # trained: world and body as in the checkpoint; current: as in this config

bench:
  sizes: [1, 8, 16, 32]
  seconds: 3.0

# ----------------------------------------------------------------------------
# Phase 2b: drives, temperaments and the agent's own life.
# Every weight and scale below is PROVISIONAL, to be calibrated in the pilot.
# ----------------------------------------------------------------------------
temperaments:                   # weights of curiosity and caution; hunger weighs 1 for everyone
  curioso: {curiosity: 1.0, caution: 0.25}
  cauteloso: {curiosity: 0.2, caution: 1.0}
  equilibrado: {curiosity: 0.5, caution: 0.5}

drives:
  set_point: 0.8                # E*: hunger is D(E) = (E* - E)^2, reward D(E_t) - D(E_t+1)
  hunger_scale: 100.0          # 10 until 17 Nov: the agent learned to stay still instead of eating
  curiosity_scale: 0.03         # curiosity = world-facing prediction error / its running mean
  curiosity_ema: 0.01           # rate of that running mean (per rollout)
  caution_scale: 25.0           # caution = -caution_scale * effort_cost * mean(a_t^2); 25 = calibrated (calib5, 21 Nov 2026)
  gate_low: 0.2                 # hunger gate g(E) = clip((E - gate_low) / (set_point - gate_low), 0, 1) multiplies curiosity only (caution is the brake)
  hunger_debt: true             # energy debt (25 Nov 2026): hunger uses E_int, which keeps falling at E = 0 by the body's cost
                                #   (no false relief at 0); not observed; false = hunger v1 (superseded_hunger_v1)
  debt_floor: -1.0              # safety floor of E_int; bodies that reach it are reported

agent:
  temperament: equilibrado      # key into temperaments
  history: 0                    # the agent lives in one history (all its parallel bodies)
  infancy: runs/20261116-152329_fase2a/checkpoints/update_0098000.pt  # common childhood, part 1 (Phase 2a); also the prediction-check baseline
  start: runs/20261121-141752_fase2b_infancia_equilibrado/checkpoints/common_start.pt                   # common childhood, part 2: common_start.pt of experiment=common_feeding (null = new actor and critic)
  width: 128                    # actor and critic MLP width
  init_log_std: -0.5

life:
  n_envs: 32
  rollout: 128                  # steps per environment per iteration
  iterations: 3600              # length of the life (iterations); life_short.pt at half, life_long.pt at the end
  episode_steps: 4096           # each body restarts (new seed, full energy) after this many steps, staggered
  world_lr: 0.0003              # the self-model keeps learning (prediction loss only)
  seq_len: 32                   # TBPTT segment of the predictor
  grad_clip: 1.0
  log_every: 10
  checkpoint_every: 50          # resumable checkpoints (multiple of log_every)
  stop_at: null                 # stop (paused, resumable) after this iteration; null = live to the end
  reset_action_std: true        # at the start of a life from agent.start, the actor's log_std goes back to agent.init_log_std
                                #   (the childhood keeps WHAT to do; every life starts as free to explore HOW)
  protected_infancy:            # the cost of living (basal + effort) starts lower and rises linearly ...
    start_factor: 0.25          # ... from this factor ...
    fraction: 0.2               # ... to 1 over this share of the life (the same for every agent and history)
  run_report: true              # behaviour battery and prediction check at the end of the life

ppo:
  lr: 0.0003
  epochs: 4
  minibatches: 4
  clip: 0.2
  gamma: 0.995                  # horizon ~200 steps: food is often farther than 100 steps
  lam: 0.95
  vf_coef: 0.5
  ent_coef: 0.001               # keeps the policy from collapsing into stillness
  grad_clip: 0.5

feeding:                        # experiment=common_feeding: common childhood part 2, learning to eat (the 4 histories mixed)
  ramp_window: 20               # competence ramp: the cost factor (from protected_infancy.start_factor) steps up by the
  ramp_max_below_01: 0.01       #   life ramp's slope only if, over the last ramp_window iterations and all bodies,
  ramp_min_p10: 0.3             #   the fraction below 0.1 < this and the energy p10 >= this; otherwise it stays (never falls)
  eval_every: 100               # criterion: first at full cost, then every this many iterations (multiple of life.log_every)
  eval_envs_per_history: 8
  eval_steps: 4096              # one whole episode, full cost, full initial energy, stochastic policy
  max_below_01: 0.02            # criterion, in every history: fraction of steps below 0.1 < this ...
  max_below_03: 0.10            # ... below 0.3 < this ...
  min_food_per_1000: 1.0        # ... and food per 1000 steps >= this
  max_hours: 3.0                # time cap: stop with status timeout
  temperament: equilibrado      # the childhood is lived with these drive weights (null = hunger only, as on 21 Nov)
  caution_scale: 50.0           # the childhood's caution scale (provisional; overrides drives.caution_scale here only)
  robustness_offsets: [100000, 200000]  # experiment=start_robustness: the criterion again on agent.start, seeds shifted by these

ethics:                         # aversive signals at the minimum; see docs/protocolo.md
  low_energy: 0.1               # energy below this counts as "very low"
  max_low_fraction: 0.10        # more than this share of the life (after warm-up) at very low energy: stop
  warmup_fraction: 0.05         # share of the life before the check starts
  zero_run_limit: 200           # individual rule (active since 22 Nov 2026): a body with this many steps in a row at
                                #   energy exactly 0 after warm-up stops the life (flagged, reason zero_run) and the queue
  zero_run_thresholds: [200, 500, 1000]  # also reported: when each of these would have stopped the life (observation)

behavior:                       # pre-specified behaviour battery (seeds from BEHAVIOR_SEED_BASE)
  checkpoint: null              # agent checkpoint for experiment=behavior_battery
  history: null                 # history of the battery (null = the agent's own; set it for common_start.pt)
  episodes: 8
  steps: 4000
  grid: 1.0                     # cell side for the covered area
  probe_every: 500              # a neutral object appears ahead every this many steps ...
  probe_offset: 250             # ... starting at this step
  probe_distance: 2.0
  probe_window: 50              # steps observed after it appears
  probe_threshold: 0.3          # distance change that counts as approaching / moving away
  n_boot: 10000

prediction:                     # experiment=prediction_own: the prediction error on the agent's own behaviour (informative)
  checkpoints: []               # agent checkpoints (common_start.pt, life_short.pt, life_long.pt ...)

diagnosis:                      # experiment=zero_diagnosis: drives and bodies at energy 0 (informative, no learning)
  checkpoint: null              # a life checkpoint (iter_*.pt, life_short.pt ...)
  steps: 1000                   # steps the policy runs on from it

replay:                         # experiment=battery_replay: battery episodes again, recorded (signals_ep<i>.npz)
  episodes: []                  # battery episode indices to record (behavior.checkpoint, behavior.history)

report:                         # experiment=agent_report: compare agents
  agents: []                    # list of agent run directories
  baseline: null                # infancy checkpoint for the prediction check (default: the agents' infancy)
  start_behavior: null          # run folder of the battery on common_start.pt: the shared baseline of the character

population:
  dir: runs/population          # fixed folder: population.json and one subfolder per agent
  temperaments: [curioso, cauteloso, equilibrado]
  histories: ["0", "1", "2", "3"]
  seeds: [0, 1, 2]
  max_agents: null              # agents to run in this session (null = all pending)
  parallel: 1                   # agents run at once (processes); 1 since 21 Nov 2026: with 2 the laptop ran out of memory twice
  overrides: []                 # extra overrides passed to every agent run
